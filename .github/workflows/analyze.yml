name: Analyze GitHub Discussions

on:
  # Run on push to main (to update when repos list changes)
  push:
    paths:
      - '.github/workflows/analyze.yml'
      - 'analyze_discussions.py'
  
  # Run daily at 8:00 UTC
  schedule:
    - cron: '0 8 * * *'
  
  # Allow manual triggering from GitHub UI
  workflow_dispatch:

# Default permissions for all jobs - read only
permissions:
  contents: read

# Repository variables can be set at: https://github.com/OWNER/REPO/settings/variables/actions
# Set USERHANDLE to your GitHub username to enable the "My items only" filter

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to fetch repository contents
      pages: write   # Required to deploy to GitHub Pages
      id-token: write # Required for OAuth authentication with Pages
    
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      
      - name: Create .env file
        env:
          USERHANDLE: ${{ vars.USERHANDLE }}
        run: |
          # Create .env with GITHUB_USER from repository variable
          echo "GITHUB_USER=$USERHANDLE" > .env
          echo "Created .env with GITHUB_USER=$USERHANDLE"
      
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      
      - name: Extract repos from README
        id: repos
        run: |
          # Extract repos from README (lines starting with - under "Often used repos:")
          REPOS=$(grep -A 100 "Often used repos:" README.md | grep "^\- " | sed 's/^\- //' | head -20 | tr '\n' ' ' | sed 's/ $//')
          echo "Repos to analyze: $REPOS"
          echo "repos=$REPOS" >> $GITHUB_OUTPUT
      
      - name: Run analyzer
        if: steps.repos.outputs.repos != ''
        run: |
          python analyze_discussions.py ${{ steps.repos.outputs.repos }} --refresh --fetch-profiles
      
      - name: Setup Pages
        if: steps.repos.outputs.repos != ''
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      
      - name: Upload reports to Pages
        if: steps.repos.outputs.repos != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: reports/
      
      - name: Deploy to GitHub Pages
        if: steps.repos.outputs.repos != ''
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
